apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: admin-gemma-openclaw
  labels:
    app: openclaw
spec:
  target:
    name: openclaw-secrets
    deletionPolicy: Delete
    template:
      type: Opaque
  data:
  - secretKey: ANTHROPIC_API_KEY
    sourceRef:
      storeRef:
        name: bitwarden-fields
        kind: ClusterSecretStore
    remoteRef:
      key: <BITWARDEN_ITEM_UUID>
      property: ANTHROPIC_API_KEY
  - secretKey: OPENCLAW_GATEWAY_TOKEN
    sourceRef:
      storeRef:
        name: bitwarden-fields
        kind: ClusterSecretStore
    remoteRef:
      key: <BITWARDEN_ITEM_UUID>
      property: OPENCLAW_GATEWAY_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-oauth-config
  namespace: admin-gemma-openclaw
  labels:
    app: openclaw
spec:
  target:
    name: openclaw-oauth-config
    deletionPolicy: Delete
    template:
      type: Opaque
  data:
  - secretKey: client-secret
    sourceRef:
      storeRef:
        name: bitwarden-fields
        kind: ClusterSecretStore
    remoteRef:
      key: <BITWARDEN_ITEM_UUID>
      property: client-secret
  - secretKey: cookie_secret
    sourceRef:
      storeRef:
        name: bitwarden-fields
        kind: ClusterSecretStore
    remoteRef:
      key: <BITWARDEN_ITEM_UUID>
      property: cookie_secret
