apiVersion: v1
kind: ConfigMap
metadata:
  name: ocp-home-kubeconfig-env
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
    controller.devfile.io/mount-to-devworkspace: 'true'
  annotations:
    controller.devfile.io/mount-as: env
    controller.devfile.io/mount-on-start: 'true'
data:
  # Keep the Dev Spaces-generated local cluster configuration first.
  # devspace-homelab retains /home/user as a symlink to /home/morey-tech.
  KUBECONFIG: /home/user/.kube/config:/etc/ocp-home/kubeconfig
