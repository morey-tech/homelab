apiVersion: v1
kind: Service
metadata:
  namespace: tailscale-system
  name: ocp-home-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    tailscale.com/tailnet-fqdn: ocp-home-api.taile3c3a8.ts.net
