# Upstream kernel-mode egress and its sysctler init container are privileged.
# Bind only the chart's proxies account, never the operator or workspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: tailscale-system
  name: tailscale-proxies-privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: proxies
    namespace: tailscale-system
