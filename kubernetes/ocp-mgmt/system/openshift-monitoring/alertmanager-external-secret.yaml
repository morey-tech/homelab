apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: alertmanager-main
    # Update the platform-provided Secret without owning its lifecycle.
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            http_config:
              proxy_from_environment: true
          inhibit_rules:
            - equal: [namespace, alertname]
              source_matchers:
                - severity = critical
              target_matchers:
                - severity =~ warning|info
            - equal: [namespace, alertname]
              source_matchers:
                - severity = warning
              target_matchers:
                - severity = info
          route:
            group_by: [namespace]
            group_interval: 5m
            group_wait: 30s
            receiver: Default
            repeat_interval: 12h
            routes:
              - matchers:
                  - alertname = Watchdog
                receiver: Watchdog
              - matchers:
                  - severity = critical
                receiver: Critical
              - matchers:
                  - severity = warning
                receiver: Warning
          receivers:
            - name: Default
            - name: Watchdog
            - name: Critical
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | toJson }}
                  send_resolved: true
                  # Preserve the inner template for Alertmanager to evaluate.
                  title: '[ocp-mgmt] {{ `{{ template "discord.default.title" . }}` }}'
            - name: Warning
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | toJson }}
                  send_resolved: true
                  title: '[ocp-mgmt] {{ `{{ template "discord.default.title" . }}` }}'
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: 7c74654f-a595-4aa6-a1c4-b4d80182f0cd
        property: password
