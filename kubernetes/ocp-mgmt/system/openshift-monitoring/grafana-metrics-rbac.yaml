apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-metrics-reader
rules:
  # Thanos's RBAC proxy checks this virtual subresource for each GET request.
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheuses/api
    resourceNames:
      - k8s
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-metrics-reader
subjects:
  - kind: ServiceAccount
    name: ocp-mgmt-metrics
    namespace: monitoring
