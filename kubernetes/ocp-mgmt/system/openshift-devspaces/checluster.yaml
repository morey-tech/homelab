# Reference: https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.24/html/administration_guide/configuring-devspaces#checluster-custom-resource-fields-reference
kind: CheCluster
apiVersion: org.eclipse.che/v2
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    imagePuller:
      enable: true
      spec:
        daemonsetName: devspaces-image-puller
        # Workspaces have no node selector; cache on all schedulable nodes.
        nodeSelector: '{}'
        # Complete list, not additions to the operator defaults. Supporting
        # digests come from the running workspace; refresh after Dev Spaces upgrades.
        images: >-
          devspace-base=ghcr.io/morey-tech/homelab/devspace-base:latest;devspace-homelab=ghcr.io/morey-tech/homelab/devspace-homelab:latest;project-clone=registry.redhat.io/devworkspace/devworkspace-project-clone-rhel9@sha256:0957c40283342a7c421ccc8c1817f2dc4ccd5b4397a336fd12da70b1a580445f;che-code=registry.redhat.io/devspaces/code-rhel9@sha256:26e0335bcd90b3aa5c9bf9b2642ba7e49e1d99fa6e82fbd0657abdb720892063;che-gateway=registry.redhat.io/devspaces/traefik-rhel9@sha256:e61ca8ea57795df262cb3247f763c3538815cc94444af84ade4bdeefa1c10e2b
    pluginRegistry:
      openVSXURL: https://open-vsx.org
  containerRegistry: {}
  devEnvironments:
    # Fallback for repositories without devfile components, not an override.
    defaultComponents:
      - name: devcontainer
        container:
          image: ghcr.io/morey-tech/homelab/devspace-homelab:latest
          mountSources: true
          sourceMapping: /projects
          volumeMounts:
            - name: opencode-data
              path: /home/morey-tech/.local/share/opencode
      - name: opencode-data
        volume:
          size: 1Gi
          ephemeral: false
    defaultContainerResources:
      requests:
        memory: 2G
        cpu: '2'
      limits:
        memory: 4G
    # XFS on local LVM volumes supports the ID-mapped mounts for user namespaces.
    disableContainerRunCapabilities: false
    # https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.24/html/administration_guide/configuring-devspaces#limiting-the-number-of-workspaces-that-all-users-can-run-simultaneously
    maxNumberOfRunningWorkspacesPerCluster: -1  # Unlimited.
    maxNumberOfRunningWorkspacesPerUser: -1     # Unlimited.
    maxNumberOfWorkspacesPerUser: -1            # Unlimited.
    persistUserHome:
      enabled: false
    # # https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.24/html/administration_guide/configuring-devspaces#preventing-automatic-stopping-of-idle-workspaces
    # # Disable automatic workspace stopping due to inactivity
    # secondsOfInactivityBeforeIdling: -1         # Disabled (-1 = never stop).
    storage:
      pvcStrategy: per-workspace
      perWorkspaceStrategyPvcConfig:
        claimSize: 5Gi
        storageClass: lvms-vg-nvme
        storageAccessMode:
          - ReadWriteOnce
  gitServices: {}
  networking: {}
