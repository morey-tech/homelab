apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qnap-mass
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: nfs.csi.k8s.io
parameters:
  server: qnap-01.rh-lab.morey.tech
  share: /storage-mass
  subDir: ocp-mgmt/${pvc.metadata.namespace}/${pvc.metadata.name}-${pv.metadata.name}
  # New claim directories must be writable by OpenShift-assigned UIDs.
  mountPermissions: "0777"
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
