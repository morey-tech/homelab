apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  observability:
    enable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authorino-service-ca
  namespace: kuadrant-system
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: authorino-authorino-authorization
  namespace: kuadrant-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  selector:
    authorino-resource: authorino
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 5001
      targetPort: 5001
---
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  clusterWide: true
  replicas: 1
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  oidcServer:
    tls:
      enabled: false
  # Keep this directory separate from the operator's /etc/ssl/certs/tls.crt
  # mount. authorino-trust.yaml adds it to Go's trusted certificate directories.
  volumes:
    items:
      - name: service-ca
        mountPath: /etc/ssl/certs/openshift-service-ca
        configMaps:
          - authorino-service-ca
