# Partial server-side apply: the Authorino CR has no environment-variable
# field. Own only this env entry; the operator owns the rest of the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,DisableClientSideApplyMigration=true,Prune=false,Delete=false
spec:
  template:
    spec:
      containers:
        - name: authorino
          env:
            # Retain Go's default Linux CA directories as well as the
            # injected service CA. Do not disable certificate verification.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/pki/tls/certs:/etc/ssl/certs/openshift-service-ca
