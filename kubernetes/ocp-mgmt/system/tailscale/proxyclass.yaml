apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: devspaces-egress
spec:
  statefulSet:
    pod:
      # Kernel-mode proxy and sysctler need root; operator retains an assigned UID.
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
