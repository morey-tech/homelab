apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: hermes-notes
spec:
  conditions:
  - namespaces:
    - hermes
  provider:
    kubernetes:
      remoteNamespace: silverbullet
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: silverbullet
          key: ca.crt
      auth:
        serviceAccount:
          name: hermes-credential-reader
          namespace: silverbullet
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notes-auth
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: hermes-notes
    kind: ClusterSecretStore
  target:
    name: notes-auth
    deletionPolicy: Retain
  data:
  - secretKey: value
    remoteRef:
      key: api-token
      property: value
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: hermes-reminders
spec:
  conditions:
  - namespaces:
    - hermes
  provider:
    kubernetes:
      remoteNamespace: ntfy
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ntfy
          key: ca.crt
      auth:
        serviceAccount:
          name: hermes-credential-reader
          namespace: ntfy
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reminder-auth
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: hermes-reminders
    kind: ClusterSecretStore
  target:
    name: reminder-auth
    deletionPolicy: Retain
  data:
  - secretKey: value
    remoteRef:
      key: hermes-password
      property: value
