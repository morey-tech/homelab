apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
- credentials.yaml
- storage.yaml
- deployment.yaml
- network.yaml
- egress-firewall.yaml
- notes-credentials.yaml
configMapGenerator:
- name: hermes-config
  files:
  - config.yaml
  - launch.py
  - signal_account.py
  - prepare_state.py
  - SOUL.md
  - oauth-start.sh
- name: personal-notes
  files:
  - personal-notes/plugin.yaml
  - personal-notes/__init__.py
  - personal-notes/store.py
  - personal-notes/reminders.py
  - personal-notes/signal_guard.py
  - personal-notes/SKILL.md
