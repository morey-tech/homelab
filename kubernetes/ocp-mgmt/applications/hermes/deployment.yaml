apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: hermes
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ms-02
                - ms-04
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
      - name: prepare-state
        image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
        command:
        - /opt/hermes/.venv/bin/python
        - -B
        - /config/prepare_state.py
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: state
          mountPath: /state
        - name: config
          mountPath: /config
          readOnly: true
      containers:
      - command:
        - /opt/hermes/.venv/bin/python
        - -B
        - /config/launch.py
        env:
        - name: HOME
          value: /opt/data
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_MANAGED_DIR
          value: /config
        - name: HERMES_WRITE_SAFE_ROOT
          value: /opt/data/workspace
        - name: OPENAI_BASE_URL
          value: https://maas.apps.ocp-mgmt.rh-lab.morey.tech/v1
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: admin
        - name: XDG_CACHE_HOME
          value: /opt/data/.cache
        - name: XDG_CONFIG_HOME
          value: /opt/data/.config
        - name: XDG_RUNTIME_DIR
          value: /tmp/hermes-runtime
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
        livenessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - -c
            - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9119/api/status",timeout=4)
          timeoutSeconds: 5
          periodSeconds: 30
        name: dashboard
        readinessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - -c
            - import json,urllib.request; r=urllib.request.urlopen("http://127.0.0.1:9119/api/status",timeout=4);
              s=json.load(r); assert s.get("auth_required") is True and "basic" in
              s.get("auth_providers", [])
          timeoutSeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - -c
            - import json,urllib.request; r=urllib.request.urlopen("http://127.0.0.1:9119/api/status",timeout=4);
              s=json.load(r); assert s.get("auth_required") is True and "basic" in
              s.get("auth_providers", [])
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: state
          mountPath: /opt/data
          subPath: hermes-home
          readOnly: false
        - name: config
          mountPath: /config
          readOnly: true
        - name: maas
          mountPath: /maas
          readOnly: true
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: dashboard-password
          mountPath: /dashboard-password
          readOnly: true
        - name: dashboard-signing-key
          mountPath: /dashboard-signing-key
          readOnly: true
        - name: notes-auth
          mountPath: /notes-auth
          readOnly: true
        - name: personal-notes
          mountPath: /opt/data/plugins/personal-notes
          readOnly: true
        - name: personal-notes
          mountPath: /opt/data/skills/personal-notes
          readOnly: true
      - name: signal
        image: ghcr.io/asamk/signal-cli:0.14.9@sha256:a6b1fc309cd8e6bab1c239bd5afaffa978ae252921e6b529643e84e180e0c4aa
        command:
        - /bin/sh
        - -ec
        - |
          umask 077
          mkdir -p /signal/account
          exec /opt/signal-cli/bin/signal-cli --data-dir /signal/account daemon \
            --http 127.0.0.1:8080 --receive-mode on-connection \
            --no-receive-stdout --ignore-stories --ignore-avatars --ignore-stickers
        env:
        - name: HOME
          value: /signal/account
        - name: JAVA_TOOL_OPTIONS
          value: -Xms64m -Xmx384m -Djava.io.tmpdir=/tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/v1/check HTTP/1.0\r\n\r\n"
              >&3; read -r line <&3; [[ "$line" == *" 200 "* ]]
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/v1/check HTTP/1.0\r\n\r\n"
              >&3; read -r line <&3; [[ "$line" == *" 200 "* ]]
          timeoutSeconds: 5
          periodSeconds: 15
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/v1/check HTTP/1.0\r\n\r\n"
              >&3; read -r line <&3; [[ "$line" == *" 200 "* ]]
          timeoutSeconds: 5
          periodSeconds: 30
        volumeMounts:
        - name: signal-state
          mountPath: /signal
        - name: signal-tmp
          mountPath: /tmp
      - args:
        - --provider=openshift
        - --https-address=:8443
        - --http-address=
        - --upstream=http://127.0.0.1:9119
        - --client-id=system:serviceaccount:hermes:hermes
        - --client-secret-file=/oauth-state/client-token
        - --cookie-secret-file=/etc/oauth/cookie_secret
        - --cookie-secure=true
        - --cookie-expire=12h
        - --scope=user:info
        - --pass-access-token=false
        - --pass-basic-auth=false
        - --pass-user-headers=true
        - --tls-cert=/etc/tls/tls.crt
        - --tls-key=/etc/tls/tls.key
        - --upstream-timeout=5m
        - --skip-provider-button=false
        command:
        - /bin/sh
        - /config/oauth-start.sh
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:c2157a771f0d04641ab2079b3fd7dd43341897833bbe5b78233ca112be575a7a
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test "$(cat /oauth-state/client-token)" = "$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        name: oauth-proxy
        ports:
        - containerPort: 8443
          name: oauth
        readinessProbe:
          httpGet:
            path: /oauth/healthz
            port: oauth
            scheme: HTTPS
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/oauth
          name: oauth-cookie
          readOnly: true
        - mountPath: /etc/tls
          name: tls
          readOnly: true
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: oauth-identity
          readOnly: true
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /oauth-state
          name: oauth-state
      - name: reminders
        image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
        command:
        - /opt/hermes/.venv/bin/python
        - -B
        - /notes/reminders.py
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /opt/data
          subPath: hermes-home
        - name: personal-notes
          mountPath: /notes
          readOnly: true
        - name: notes-auth
          mountPath: /notes-auth
          readOnly: true
        - name: reminder-auth
          mountPath: /reminder-auth
          readOnly: true
        readinessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - -c
            - import time,pathlib; assert time.time()-float(pathlib.Path('/opt/data/personal-notes/worker-heartbeat').read_text())
              < 300
          timeoutSeconds: 5
          periodSeconds: 30
        livenessProbe:
          exec:
            command:
            - /opt/hermes/.venv/bin/python
            - -c
            - import time,pathlib; assert time.time()-float(pathlib.Path('/opt/data/personal-notes/worker-heartbeat').read_text())
              < 300
          timeoutSeconds: 5
          periodSeconds: 30
          initialDelaySeconds: 300
          failureThreshold: 5
      securityContext:
        # Avoid re-opening private gateway files on each volume mount.
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 45
      volumes:
      - name: signal-state
        persistentVolumeClaim:
          claimName: signal-state
      - name: signal-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: state
        persistentVolumeClaim:
          claimName: hermes-state
      - configMap:
          name: hermes-config
        name: config
      - name: maas
        secret:
          secretName: maas-api-key
      - name: oauth-cookie
        secret:
          secretName: oauth-cookie
      - name: tls
        secret:
          secretName: hermes-tls
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
      - name: oauth-identity
        projected:
          sources:
          - serviceAccountToken:
              expirationSeconds: 86400
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  fieldPath: metadata.namespace
                path: namespace
      - emptyDir:
          medium: Memory
          sizeLimit: 1Mi
        name: oauth-state
      - name: dashboard-password
        secret:
          secretName: dashboard-password
      - name: dashboard-signing-key
        secret:
          secretName: dashboard-signing-key
      - name: personal-notes
        configMap:
          name: personal-notes
      - name: notes-auth
        secret:
          secretName: notes-auth
      - name: reminder-auth
        secret:
          secretName: reminder-auth
