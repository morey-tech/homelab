# Install before NetworkPolicy allows public HTTPS; manage these together.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  egress:
  - type: Allow
    to:
      dnsName: clawhub.ai
    ports:
    - protocol: TCP
      port: 443
  - type: Allow
    to:
      dnsName: codeload.github.com
    ports:
    - protocol: TCP
      port: 443
  - type: Allow
    to:
      dnsName: github.com
    ports:
    - protocol: TCP
      port: 443
  - type: Allow
    to:
      dnsName: raw.githubusercontent.com
    ports:
    - protocol: TCP
      port: 443
  - type: Allow
    to:
      dnsName: api.github.com
    ports:
    - protocol: TCP
      port: 443
  - type: Allow
    to:
      cidrSelector: 10.128.0.0/14
  - type: Allow
    to:
      cidrSelector: 172.30.0.0/16
  - type: Allow
    to:
      cidrSelector: 192.168.6.0/24
  - type: Deny
    to:
      cidrSelector: 0.0.0.0/0
  - type: Deny
    to:
      cidrSelector: ::/0
