apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whisper-cpu
spec:
  parentRefs:
  - name: maas-default-gateway
    namespace: openshift-ingress
    sectionName: https
  # Inherit the HTTPS listener hostname, matching the generated model routes.
  # An explicit hostname forms a separate Istio route group whose exact speech
  # match can be appended after the broad /inference-server/local-llm prefix.
  rules:
  - matches:
    - path:
        type: Exact
        value: /inference-server/local-llm/v1/audio/transcriptions
      method: POST
    backendRefs:
    - name: whisper-cpu
      port: 8000
    timeouts:
      request: 150s
      backendRequest: 145s
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: whisper-cpu
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: whisper-cpu
  limits:
    audio:
      rates:
      - limit: 100000
        window: 1m
      counters:
      - expression: auth.identity.userid
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: whisper-cpu-requests
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: whisper-cpu
  limits:
    audio-requests:
      rates:
      - limit: 6
        window: 1m
      counters:
      - expression: auth.identity.userid
