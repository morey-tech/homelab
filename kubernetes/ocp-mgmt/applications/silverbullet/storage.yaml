apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: space
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: lvms-vg-nvme
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: qnap-mass
  resources:
    requests:
      storage: 30Gi
