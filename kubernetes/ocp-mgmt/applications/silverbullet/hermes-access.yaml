apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-credential-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-credential-reader
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-credential-reader
subjects:
- kind: ServiceAccount
  name: hermes-credential-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-credential-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-credential-token
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - hermes-credential-reader
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-credential-token
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-credential-token
