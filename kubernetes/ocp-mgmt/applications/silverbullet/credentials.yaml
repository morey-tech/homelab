apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: browser-password
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: browser-password
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        value: admin:{{ .password }}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: browser-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-token
spec:
  length: 64
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: api-token
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        value: '{{ .password }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: api-token
