apiVersion: v1
kind: ServiceAccount
metadata:
  name: anythingllm
automountServiceAccountToken: false
---
# The controller supplies the token; no credential value is stored in Git.
apiVersion: v1
kind: Secret
metadata:
  name: anythingllm-inference-token
  annotations:
    kubernetes.io/service-account.name: anythingllm
type: kubernetes.io/service-account-token
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: anythingllm-auth
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - AUTH_TOKEN
    - JWT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anythingllm-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: anythingllm-auth
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: anythingllm-auth
