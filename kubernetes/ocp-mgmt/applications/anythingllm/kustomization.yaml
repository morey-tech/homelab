apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: anythingllm
resources:
  - credentials.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: anythingllm-config
    literals:
      - DISABLE_TELEMETRY=true
      - LLM_PROVIDER=generic-openai
      - GENERIC_OPEN_AI_BASE_PATH=https://local-llm-inference-server.apps.ocp-mgmt.rh-lab.morey.tech/v1
      - GENERIC_OPEN_AI_MODEL_PREF=local-llm
      - GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT=32768
      - GENERIC_OPEN_AI_MAX_TOKENS=1024
      - VECTOR_DB=lancedb
      - EMBEDDING_ENGINE=native
