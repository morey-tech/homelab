apiVersion: batch/v1
kind: Job
metadata:
  name: download-model
  annotations:
    # Job pod templates are immutable; recreate only this Job when syncing it.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: tr-gpu
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: ghcr.io/morey-tech/homelab/hf-cli@sha256:c502ba8270aba4672b15bfb627e8b274e75855985e2c92abd22d31e703211f4a
          command:
            - python
            - -c
          args:
            - |
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download

              target = Path(os.environ["MODEL_DIRECTORY"])
              revision = os.environ["MODEL_REVISION"]
              marker = target / ".download-complete"
              if marker.exists() and marker.read_text().strip() == revision:
                  print("Pinned model revision already downloaded")
              else:
                  snapshot_download(
                      repo_id=os.environ["MODEL_REPO"],
                      revision=revision,
                      local_dir=str(target),
                      max_workers=1,
                  )
                  for name in (
                      "config.json",
                      "tokenizer_config.json",
                      "model.safetensors.index.json",
                      "model-00001-of-00003.safetensors",
                      "model-00002-of-00003.safetensors",
                      "model-00003-of-00003.safetensors",
                  ):
                      if not (target / name).is_file():
                          raise RuntimeError(f"Missing model artifact: {name}")
                  marker.write_text(revision + "\n")
                  print("Pinned model revision downloaded successfully")
          env:
            - name: MODEL_REPO
              value: Qwen/Qwen3-4B-Instruct-2507
            - name: MODEL_REVISION
              value: cdbee75f17c01a7cc42f958dc650907174af0554
            - name: MODEL_DIRECTORY
              value: /models/qwen3-4b-instruct-2507-cdbee75f17c01a7cc42f958dc650907174af0554
            - name: HF_HOME
              value: /tmp/huggingface
            # Use HTTP downloads to avoid Xet's additional transfer concurrency.
            - name: HF_HUB_DISABLE_XET
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
