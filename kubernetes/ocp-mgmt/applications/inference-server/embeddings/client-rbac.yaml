apiVersion: v1
kind: ServiceAccount
metadata:
  name: embedding-client
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embedding-client
rules:
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    resourceNames:
      - qwen3-embedding-0-6b
      - qwen3-embedding-4b
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embedding-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: embedding-client
subjects:
  - kind: ServiceAccount
    name: embedding-client
    namespace: inference-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rr-lessons-embeddings
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: embedding-client
subjects:
  - kind: ServiceAccount
    name: rr-lessons
    namespace: rr-lessons
