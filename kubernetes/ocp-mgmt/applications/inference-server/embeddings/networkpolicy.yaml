apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embeddings-ingress
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: In
        values:
          - qwen3-embedding-0-6b
          - qwen3-embedding-4b
  policyTypes:
    - Ingress
  ingress:
    # Clients enter through KServe's token-authenticating proxy.
    - ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
                  - redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8080
