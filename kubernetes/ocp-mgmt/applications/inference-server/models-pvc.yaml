apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  annotations:
    # Same sync wave as the download Job: WFFC needs its consumer to bind.
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvms-vg-ai
  resources:
    requests:
      storage: 50Gi
