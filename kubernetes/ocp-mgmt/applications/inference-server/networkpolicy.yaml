apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-llm-ingress
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: local-llm
  policyTypes:
    - Ingress
  ingress:
    # All inference clients enter through KServe's token-authenticating proxy.
    - ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
                  - redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8080
