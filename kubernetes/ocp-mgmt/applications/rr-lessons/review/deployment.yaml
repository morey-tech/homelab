apiVersion: v1
kind: ServiceAccount
metadata:
  name: rr-lessons-review
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rr-lessons-review
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rr-lessons-review
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: rr-lessons-review
    spec:
      serviceAccountName: rr-lessons-review
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ms-02
                - ms-04
      initContainers:
      - name: install-dependencies
        image: docker.io/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
        command:
        - python3
        - -m
        - pip
        - install
        args:
        - --disable-pip-version-check
        - --no-cache-dir
        - --no-compile
        - --require-hashes
        - '--only-binary=:all:'
        - --target=/opt/python-deps
        - -r
        - /app/requirements.txt
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: dependencies
          mountPath: /opt/python-deps
        - name: tmp
          mountPath: /tmp
      containers:
      - name: review
        image: docker.io/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
        command:
        - python3
        - -m
        - uvicorn
        args:
        - server:app
        - --app-dir=/app
        - --host=0.0.0.0
        - --port=8080
        - --workers=1
        - --no-access-log
        - --no-proxy-headers
        - --limit-concurrency=32
        - --timeout-keep-alive=5
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: REVIEW_DB_PATH
          value: /data/reviews.sqlite3
        - name: REVIEW_STATIC_DIR
          value: /ui
        - name: PUBLISHING_ENABLED
          value: 'true'
        - name: INGESTION_ENABLED
          value: 'true'
        - name: REVIEW_PUBLIC_ORIGIN
          value: https://review-rr-lessons.apps.ocp-mgmt.rh-lab.morey.tech
        - name: MODEL_TOKEN_PATH
          value: /var/run/model-auth/token
        - name: PYTHONPATH
          value: /opt/python-deps:/pipeline:/contract
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: dependencies
          mountPath: /opt/python-deps
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: pipeline
          mountPath: /pipeline
          readOnly: true
        - name: model-auth
          mountPath: /var/run/model-auth
          readOnly: true
        - name: publication-contract
          mountPath: /contract
          readOnly: true
        - name: ui
          mountPath: /ui
          readOnly: true
      volumes:
      - name: publication-contract
        configMap:
          name: rr-lessons-publication-contract
      - name: pipeline
        configMap:
          name: rr-lessons-preparation
      - name: model-auth
        projected:
          defaultMode: 0440
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
      - name: app
        configMap:
          name: rr-lessons-review-server
      - name: dependencies
        emptyDir:
          sizeLimit: 128Mi
      - name: data
        persistentVolumeClaim:
          claimName: rr-lessons-review
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: ui
        configMap:
          name: rr-lessons-review-ui
