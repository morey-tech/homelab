apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rr-lessons-review
spec:
  podSelector:
    matchLabels:
      app: rr-lessons-review
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector:
            matchLabels:
              app: rr-lessons-lancedb
      ports:
        - protocol: TCP
          port: 8080
