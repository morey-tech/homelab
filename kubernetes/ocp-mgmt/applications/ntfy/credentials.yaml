apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-password
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: hermes-password
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        value: '{{ .password }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: hermes-password
