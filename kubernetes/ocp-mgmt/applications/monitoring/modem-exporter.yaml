apiVersion: v1
kind: ServiceAccount
metadata:
  name: modem-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modem-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: modem-exporter
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: modem-exporter
    spec:
      serviceAccountName: modem-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ms-02
                - ms-04
      containers:
      - name: exporter
        image: docker.io/library/python:3.13-slim
        ports:
        - name: http
          containerPort: 9780
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: MODEM_URL
          value: http://192.168.100.1
        - name: PYTHONUNBUFFERED
          value: '1'
        volumeMounts:
        - name: config
          mountPath: /opt/modem
          readOnly: true
        - name: credentials
          mountPath: /etc/modem-credentials
          readOnly: true
        command:
        - python3
        - -B
        - /opt/modem/exporter.py
      volumes:
      - name: config
        configMap:
          name: modem-exporter-config
      - name: credentials
        secret:
          secretName: modem-login-v1
---
apiVersion: v1
kind: Service
metadata:
  name: modem-exporter
spec:
  selector:
    app: modem-exporter
  ports:
  - name: http
    port: 9780
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modem-exporter-ingress
spec:
  podSelector:
    matchLabels:
      app: modem-exporter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: alloy
    ports:
    - protocol: TCP
      port: 9780
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.100.1/32
    ports:
    - protocol: TCP
      port: 80
