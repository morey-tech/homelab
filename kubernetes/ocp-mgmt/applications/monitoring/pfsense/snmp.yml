    retries: 1
    timeout: 3s
    metrics:
    - name: sysDescr
      oid: 1.3.6.1.2.1.1.1
      type: DisplayString
      help: sysDescr from standard SNMP MIBs.
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
