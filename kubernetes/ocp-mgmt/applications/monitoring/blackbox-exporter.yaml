apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: blackbox-exporter
    spec:
      serviceAccountName: blackbox-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ms-02
                      - ms-04
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.29.0
          ports:
            - name: http
              containerPort: 9115
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
          args:
            - --config.file=/etc/blackbox/blackbox.yml
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
