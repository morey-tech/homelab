apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ms-02
                      - ms-04
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.1
          ports:
            - name: http
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
            - name: qnap-credentials
              mountPath: /etc/alloy-secrets/qnap
              readOnly: true
            - name: mikrotik-credentials
              mountPath: /etc/alloy-secrets/mikrotik
              readOnly: true
            - name: pfsense-credentials
              mountPath: /etc/alloy-secrets/pfsense
              readOnly: true
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
            - /etc/alloy/config.alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          persistentVolumeClaim:
            claimName: alloy
        - name: qnap-credentials
          secret:
            secretName: qnap-snmp-v1
        - name: mikrotik-credentials
          secret:
            secretName: mikrotik-snmp-v1
        - name: pfsense-credentials
          secret:
            secretName: pfsense-snmp-v1
