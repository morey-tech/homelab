[server]
root_url = https://grafana.apps.ocp-mgmt.rh-lab.morey.tech

[security]
admin_user = admin
cookie_secure = true
cookie_samesite = lax

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[log]
mode = console
