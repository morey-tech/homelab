apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-mgmt-metrics
automountServiceAccountToken: false
---
# The token controller populates this Secret. Rotate by changing its name and
# the Grafana env reference together in Git; pruning revokes the previous token.
apiVersion: v1
kind: Secret
metadata:
  name: ocp-mgmt-metrics-token-v1
  annotations:
    kubernetes.io/service-account.name: ocp-mgmt-metrics
type: kubernetes.io/service-account-token
---
# Keep separate from user configuration: service-ca owns the entire data field.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-service-ca
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
# Stable, private encryption key for Grafana's stored data-source credentials.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-encryption-key
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-encryption-key
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-encryption-key
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-encryption-key
