apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: modem-login-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: modem-login-v1
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: 769bd8e4-500b-4cf6-899f-b47c013712b2
      property: username
  - secretKey: password
    remoteRef:
      key: 769bd8e4-500b-4cf6-899f-b47c013712b2
      property: password
