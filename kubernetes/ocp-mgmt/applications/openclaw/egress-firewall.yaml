apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  annotations:
    # Install the external destination restriction before permitting public
    # HTTPS in NetworkPolicy. Keep both resources managed together.
    argocd.argoproj.io/sync-wave: '-1'
spec:
  egress:
  - type: Allow
    to:
      dnsName: clawhub.ai
    ports:
    - protocol: TCP
      port: 443
  # Preserve cluster DNS, router, MaaS, and API connectivity. NetworkPolicy
  # still limits which destinations and ports within these ranges are allowed.
  - type: Allow
    to:
      cidrSelector: 10.128.0.0/14
  - type: Allow
    to:
      cidrSelector: 172.30.0.0/16
  - type: Allow
    to:
      cidrSelector: 192.168.6.0/24
  - type: Deny
    to:
      cidrSelector: 0.0.0.0/0
  - type: Deny
    to:
      cidrSelector: ::/0
