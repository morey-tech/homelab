apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openclaw-maas
spec:
  conditions:
  - namespaces:
    - openclaw
  provider:
    kubernetes:
      remoteNamespace: openclaw-maas
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: openclaw-maas
          key: ca.crt
      auth:
        serviceAccount:
          name: maas-key-reader
          namespace: openclaw-maas
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-api-key
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openclaw-maas
    kind: ClusterSecretStore
  target:
    name: maas-api-key
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        MAAS_API_KEY: '{{ .apikey }}'
  data:
  - secretKey: apikey
    remoteRef:
      key: maas-workspace-key
      property: MAAS_API_KEY
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: oauth-cookie
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth-cookie
spec:
  refreshPolicy: CreatedOnce
  target:
    name: oauth-cookie
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        cookie_secret: '{{ .password }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: oauth-cookie
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind": "OAuthRedirectReference",
      "apiVersion": "v1", "reference": {"kind": "Route", "name": "openclaw"}}'
automountServiceAccountToken: false
