# Prevent the unused 2.5GbE ports from acquiring DHCP addresses and creating
# an asymmetric return path that breaks LAN access to the node through br-ex.
# Match by permanent MAC address so the restriction survives interface renaming.
# Append to NetworkManager's existing unmanaged-device list.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-disable-ms01-2p5g
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /etc/NetworkManager/conf.d/99-disable-ms01-2p5g.conf
        mode: 420
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,W2tleWZpbGVdCnVubWFuYWdlZC1kZXZpY2VzKz1tYWM6NTg6NDc6Y2E6N2Y6MDQ6OTY7bWFjOjU4OjQ3OmNhOjdmOjA0Ojk3Cg==

## Base64 Contents
# [keyfile]
# unmanaged-devices+=mac:58:47:ca:7f:04:96;mac:58:47:ca:7f:04:97