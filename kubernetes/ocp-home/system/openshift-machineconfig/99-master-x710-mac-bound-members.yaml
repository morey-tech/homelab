# ocp-home SNO: match onboard X710 bond members by permanent MAC.
# Applying this MachineConfig may reboot the master node.
# Keep the 82599ES PCIe card installed for the initial rollout.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-x710-mac-bound-members
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /etc/NetworkManager/system-connections/enp3s0f0.nmconnection
        mode: 384
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
      - path: /etc/NetworkManager/system-connections/enp3s0f1.nmconnection
        mode: 384
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,