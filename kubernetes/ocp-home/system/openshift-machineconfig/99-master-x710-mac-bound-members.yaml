# Bind the onboard X710 bond members by permanent MAC instead of interface name,
# allowing NetworkManager to match them if PCI enumeration changes after removal
# of the unused PCIe card. Profile IDs and UUIDs remain unchanged.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-x710-mac-bound-members
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /etc/NetworkManager/system-connections/enp3s0f0.nmconnection
        mode: 384
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
      - path: /etc/NetworkManager/system-connections/enp3s0f1.nmconnection
        mode: 384
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,

