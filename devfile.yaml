schemaVersion: 2.3.0
metadata:
  generateName: morey-tech-homelab
  version: 0.1.0
components:
  - name: devcontainer
    container:
      image: ghcr.io/morey-tech/homelab/devspace-homelab:latest
      memoryRequest: 2Gi
      memoryLimit: 4Gi
      cpuRequest: 100m
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: codex-state
          path: /home/morey-tech/.codex
        - name: opencode-data
          path: /home/morey-tech/.local/share/opencode
  # Keep Codex sessions, settings, and authentication across workspace restarts.
  - name: codex-state
    volume:
      size: 1Gi
      ephemeral: false
  # OpenCode stores sessions in its XDG data directory; home itself is ephemeral.
  - name: opencode-data
    volume:
      size: 1Gi
      ephemeral: false
commands:
  - id: post-create-setup
    exec:
      component: devcontainer
      workingDir: ${PROJECT_SOURCE}
      commandLine: ${PROJECT_SOURCE}/.devcontainer/postCreate.sh
events:
  postStart:
    - post-create-setup
